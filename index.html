<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#02040b" />
    <title>Photon Circuit · PixiJS</title>
  </head>
  <body>
    <div id="app" class="game-shell">
      <div id="game-viewport" class="game-viewport">
        <svg id="background-svg" class="background-svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <defs>
            <radialGradient id="bgGlow" cx="50%" cy="48%" r="70%">
              <stop offset="0" stop-color="#102842" />
              <stop offset="0.52" stop-color="#07111f" />
              <stop offset="1" stop-color="#010207" />
            </radialGradient>
            <linearGradient id="waterFade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#0b2340" stop-opacity=".10" />
              <stop offset=".56" stop-color="#0a4160" stop-opacity=".16" />
              <stop offset="1" stop-color="#07364c" stop-opacity=".34" />
            </linearGradient>
            <filter id="cyanGlow" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur stdDeviation="7" result="blur" />
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="magentaGlow" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur stdDeviation="7" result="blur" />
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
              <path d="M48 0 L0 0 0 48" fill="none" stroke="#17304b" stroke-width="1" opacity=".22" />
            </pattern>
            <pattern id="waterWaves" width="160" height="54" patternUnits="userSpaceOnUse">
              <path d="M-20 22 C10 5 38 39 68 22 S126 5 160 22 S214 39 240 22" fill="none" stroke="#54d9ff" stroke-width="1.4" opacity=".22" />
              <path d="M-40 42 C-6 25 24 58 58 42 S116 25 150 42 S208 58 240 42" fill="none" stroke="#83f8ff" stroke-width="1" opacity=".12" />
            </pattern>
          </defs>
          <rect width="1280" height="720" fill="url(#bgGlow)" />
          <rect width="1280" height="720" fill="url(#grid)" opacity=".34" />
          <g class="water-floor">
            <path d="M0 385 L1280 385 L1280 720 L0 720 Z" fill="url(#waterFade)" />
            <rect class="water-wave-sheet water-wave-sheet-a" x="-160" y="390" width="1600" height="380" fill="url(#waterWaves)" />
            <rect class="water-wave-sheet water-wave-sheet-b" x="-320" y="420" width="1760" height="330" fill="url(#waterWaves)" opacity=".5" />
            <path d="M0 385 L1280 385" stroke="#5de8ff" stroke-width="1" opacity=".14" />
          </g>
        </svg>

        <div id="level-stack" class="level-stack"></div>
        <div id="pixi-ui" class="pixi-ui"></div>
        <button id="track-editor-open" class="track-editor-open" type="button">EDITOR DE PISTA</button>
        <div id="pixi-boot" class="pixi-boot">BOOTING PIXI…</div>
      </div>

      <div id="track-editor-modal" class="track-editor-modal" aria-hidden="true">
        <section class="track-editor-panel" role="dialog" aria-modal="true" aria-labelledby="track-editor-title">
          <header class="track-editor-header">
            <div>
              <div class="track-editor-kicker">PHOTON CIRCUIT</div>
              <h2 id="track-editor-title">Editor de pista</h2>
            </div>
            <button id="track-editor-close" class="track-editor-close" type="button" aria-label="Cerrar">×</button>
          </header>

          <div class="track-editor-meta">
            <label>Nombre<input id="track-editor-name" type="text" /></label>
            <label>ID<input id="track-editor-id" type="text" /></label>
            <label class="track-editor-speed">Velocidad ×<input id="track-editor-speed" type="number" min="0.1" step="0.1" /></label>
          </div>

          <div class="track-editor-workspace">
            <section class="track-editor-sequence" aria-label="Secuencia de slots">
              <div class="track-editor-section-head">
                <div>
                  <strong>Secuencia</strong>
                  <span id="track-editor-slot-count"></span>
                </div>
                <div class="track-editor-file-actions">
                  <button id="track-editor-new" type="button">Nuevo</button>
                  <button id="track-editor-duplicate" type="button">Duplicar</button>
                </div>
              </div>
              <div class="track-editor-columns">
                <span>#</span><span>Tipo</span><span>Parámetros</span><span></span>
              </div>
              <div id="track-editor-list" class="track-editor-list"></div>
            </section>

            <aside class="track-editor-preview" aria-label="Minimapa del circuito">
              <div class="track-editor-section-head">
                <div>
                  <strong>Minimapa 2D</strong>
                  <span id="track-editor-map-info">Todas las capas</span>
                </div>
                <button id="track-editor-layer" type="button" title="Cambiar capa">CAPAS: TODAS</button>
              </div>
              <div class="track-editor-map-frame">
                <svg id="track-editor-map" viewBox="0 0 420 300" preserveAspectRatio="xMidYMid meet" aria-label="Vista previa 2D del circuito"></svg>
                <div id="track-editor-map-error" class="track-editor-map-error"></div>
              </div>
              <div id="track-editor-levels" class="track-editor-levels"></div>
            </aside>
          </div>

          <footer class="track-editor-footer">
            <div class="track-editor-load-group">
              <select id="track-editor-load-select"></select>
              <button id="track-editor-load" type="button">Cargar</button>
            </div>
            <div id="track-editor-status" class="track-editor-status">Circuito actual</div>
            <button id="track-editor-save" class="primary" type="button">Guardar y aplicar</button>
          </footer>
        </section>
      </div>
    </div>
    <script type="module" src="/src/pixi-main.ts"></script>
  </body>
</html>
