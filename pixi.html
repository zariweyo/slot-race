<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#02040b" />
    <title>Photon Circuit · PixiJS</title>
  </head>
  <body>
    <div id="app" class="game-shell">
      <svg id="track-svg" class="track-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
            <stop offset="0" stop-color="#102842" />
            <stop offset="0.48" stop-color="#07111f" />
            <stop offset="1" stop-color="#010207" />
          </radialGradient>
          <linearGradient id="roadGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#18243a" />
            <stop offset="0.45" stop-color="#090f1b" />
            <stop offset="1" stop-color="#131d31" />
          </linearGradient>
          <filter id="cyanGlow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="magentaGlow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="7" result="blur" />
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="bridgeShadow" x="-80%" y="-160%" width="260%" height="420%">
            <feGaussianBlur stdDeviation="16" />
          </filter>
          <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
            <path d="M 52 0 L 0 0 0 52" fill="none" stroke="#17304b" stroke-width="1" opacity=".22" />
          </pattern>
        </defs>

        <rect width="1600" height="900" fill="url(#bgGlow)" />
        <rect width="1600" height="900" fill="url(#grid)" opacity=".58" />

        <!-- This hidden path is the single authoritative geometry for SVG and Pixi. -->
        <path id="track-source" fill="none" stroke="none"
          d="M 80 450
             C 180 150 330 150 430 450
             C 530 750 650 750 750 450
             C 850 150 970 150 1070 450
             C 1170 750 1320 750 1520 450
             C 1320 150 1170 150 1070 450
             C 970 750 850 750 750 450
             C 650 150 530 150 430 450
             C 330 750 180 750 80 450 Z" />

        <g id="track-base">
          <path id="track-outer-glow" fill="none" stroke="#4a25ff" stroke-width="142" opacity=".11" filter="url(#magentaGlow)" />
          <path id="track-border" fill="none" stroke="#182941" stroke-width="128" />
          <path id="track-road" fill="none" stroke="url(#roadGradient)" stroke-width="116" />
          <path id="track-inner-sheen" fill="none" stroke="#174d74" stroke-width="92" opacity=".18" />
          <path id="lane-a-dark" fill="none" stroke="#010309" stroke-width="7" />
          <path id="lane-b-dark" fill="none" stroke="#010309" stroke-width="7" />
          <path id="lane-a" fill="none" stroke="#83f8ff" stroke-width="1.8" opacity=".94" filter="url(#cyanGlow)" />
          <path id="lane-b" fill="none" stroke="#ff72ee" stroke-width="1.8" opacity=".84" filter="url(#magentaGlow)" />
        </g>

        <g id="track-decor"></g>
        <g id="curve-arrows"></g>
        <g id="bridge-layer"></g>

        <g class="track-title">
          <text x="800" y="420" text-anchor="middle">PHOTON CIRCUIT // TRINITY</text>
          <text x="800" y="450" text-anchor="middle" class="subtitle">3 OVERPASSES · MULTIPLAYER TRACK MODEL</text>
        </g>
      </svg>

      <div id="pixi-layer" class="pixi-layer"></div>
      <div id="pixi-boot" class="pixi-boot">BOOTING PIXI…</div>
    </div>
    <script type="module" src="/src/pixi-main.ts"></script>
  </body>
</html>
